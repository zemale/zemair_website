name: Deploy to nichost FTP

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: deploy-zemair
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Inject SEO verification files
        run: |
          cat > dist/yandex_2b1cbcf41d8fabad.html <<'EOF'
          <html>
              <head>
                  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
              </head>
              <body>Verification: 2b1cbcf41d8fabad</body>
          </html>
          EOF
          cat > dist/google7a266ca7df8dc492.html <<'EOF'
          google-site-verification: google7a266ca7df8dc492.html
          EOF
          ls -la dist/yandex_*.html dist/google*.html

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy via lftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          CSS_FILE=$(ls dist/assets/index-*.css | head -1 | sed 's|dist/assets/||')
          JS_FILE=$(ls dist/assets/index-*.js | head -1 | sed 's|dist/assets/||')
          echo "CSS: $CSS_FILE"
          echo "JS: $JS_FILE"
          
          # Upload main files
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "set ftp:ssl-allow no; set ftp:passive-mode on; rm -f /index.html; put dist/index.html -o /index.html; put dist/favicon.svg -o /favicon.svg; put dist/logo.svg -o /logo.svg; put dist/robots.txt -o /robots.txt; put dist/sitemap.xml -o /sitemap.xml; put dist/zemair_installation_card.pdf -o /zemair_installation_card.pdf; put dist/og-image.jpg -o /og-image.jpg; rm -f /assets/$CSS_FILE; put dist/$CSS_FILE -o /assets/$CSS_FILE; rm -f /assets/$JS_FILE; put dist/$JS_FILE -o /assets/$JS_FILE; bye"
          
          # Upload images one by one
          for f in dist/assets/images/*; do
            basename=$(basename "$f")
            echo "Uploading $basename..."
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "set ftp:ssl-allow no; set ftp:passive-mode on; rm -f /assets/$basename; put $f -o /assets/$basename; bye"
          done
