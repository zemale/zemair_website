name: Deploy to Production

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Deploy via SFTP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FTP_HOST || secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER || secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASS || secrets.FTP_PASSWORD }}
          source: "dist/*"
          target: ${{ secrets.FTP_PATH }}/
          strip_components: 1
          overwrite: true
